<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3EDC86"/>
      <stop offset="1" stop-color="#0C7F5C"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11594A"/>
      <stop offset="1" stop-color="#083A2F"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="184"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#04382A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <!-- USB-C 線 -->
    <path d="M512 752 C512 842 650 830 668 960" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <!-- 手機 -->
    <rect x="362" y="184" width="300" height="510" rx="60" fill="#FFFFFF"/>
    <!-- 插頭 -->
    <rect x="474" y="680" width="76" height="86" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="490" y="700" width="44" height="10" rx="5" fill="#0C7F5C" opacity="0.35"/>

  <!-- 螢幕 -->
  <rect x="386" y="224" width="252" height="430" rx="36" fill="url(#screen)"/>
  <rect x="482" y="200" width="60" height="10" rx="5" fill="#D5E8E0"/>

  <!-- 資料上下行 -->
  <g fill="none" stroke="#3EDC86" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M466 566 V326"/>
    <path d="M422 370 L466 326 L510 370"/>
    <path d="M558 326 V566"/>
    <path d="M514 522 L558 566 L602 522"/>
  </g>
</svg>
